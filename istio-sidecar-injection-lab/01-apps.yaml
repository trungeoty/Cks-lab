apiVersion: apps/v1
kind: Deployment
metadata:
  name: one
  namespace: team-sedum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: one
  template:
    metadata:
      labels:
        app: one
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -qO- http://two; sleep 5; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: two
  namespace: team-sedum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: two
  template:
    metadata:
      labels:
        app: two
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=hello-from-two"
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: two
  namespace: team-sedum
spec:
  selector:
    app: two
  ports:
    - name: http
      port: 80
      targetPort: 5678
