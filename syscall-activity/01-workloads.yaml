apiVersion: apps/v1
kind: Deployment
metadata:
  name: suspect-app
  namespace: team-tulip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: suspect-app
  template:
    metadata:
      labels:
        app: suspect-app
    spec:
      containers:
        - name: suspect
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                kill -0 1
                sleep 30
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normal-app
  namespace: team-tulip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: normal-app
  template:
    metadata:
      labels:
        app: normal-app
    spec:
      containers:
        - name: normal
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]