apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restricted-pod-operator
  namespace: restricted
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restricted-pod-operator
  namespace: restricted
subjects:
  - kind: User
    name: restricted
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: restricted-pod-operator
  apiGroup: rbac.authorization.k8s.io