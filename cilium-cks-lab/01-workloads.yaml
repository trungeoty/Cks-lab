apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmitter
  namespace: team-iris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmitter
      type: messenger
  template:
    metadata:
      labels:
        app: transmitter
        type: messenger
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
