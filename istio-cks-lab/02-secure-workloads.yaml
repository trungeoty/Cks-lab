apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-server
  namespace: istio-secure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-server
  template:
    metadata:
      labels:
        app: secure-server
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: secure-server
  namespace: istio-secure
spec:
  selector:
    app: secure-server
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-client
  namespace: istio-secure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-client
  template:
    metadata:
      labels:
        app: secure-client
    spec:
      containers:
      - name: curl
        image: curlimages/curl:8.10.1
        command: ["sh", "-c", "sleep 365000"]
