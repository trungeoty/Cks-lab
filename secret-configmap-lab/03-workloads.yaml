apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-client
  namespace: team-khaki-us-east-ad1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-client
  template:
    metadata:
      labels:
        app: db-client
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-con
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-con
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-client
  namespace: team-khaki-us-east-ad1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-client
  template:
    metadata:
      labels:
        app: app-client
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          envFrom:
            - configMapRef:
                name: app-data
          volumeMounts:
            - name: app-config
              mountPath: /etc/app-config
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: app-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-client
  namespace: team-khaki-us-east-ad1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-client
  template:
    metadata:
      labels:
        app: user-client
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          volumeMounts:
            - name: user-data
              mountPath: /etc/user-data
              readOnly: true
      volumes:
        - name: user-data
          secret:
            secretName: user-data